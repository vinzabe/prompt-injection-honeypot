[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-injection-honeypot"
version = "1.0.0"
description = "Canary-token network that reveals when an autonomous agent scraped your content and acted on it: unique per-placement tokens, out-of-band trigger correlation, and an attribution confidence that is honest about what a trigger does and does not prove."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vinzabe", email = "gabejar@usa.com" }]
keywords = ["security", "prompt-injection", "honeypot", "llm-security", "canary-tokens"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
pihoney = "pihoney.cli:main"

[project.urls]
Homepage = "https://github.com/vinzabe/prompt-injection-honeypot"
Issues = "https://github.com/vinzabe/prompt-injection-honeypot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pihoney"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pihoney"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S101", "ARG001", "ARG002", "ARG005", "F841"]
